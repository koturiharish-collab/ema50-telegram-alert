name: 50 EMA Cross Alert (Daily)

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore market-hours check (for testing only)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ema50-alert
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance pandas requests

      - name: Run 50 EMA scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UNIVERSE: all
          MIN_AVG_VOL: "100000"
          FORCE: ${{ inputs.force }}
        run: python ema50_alert.py

      - name: Save alert state
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add ema50_state.json
          git diff --staged --quiet || (git commit -m "update ema50 state" && git push)
